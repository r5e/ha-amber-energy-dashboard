[project]
name = "ha-amber-energy-dashboard"
version = "0.0.0"
description = "Development environment for the amber_energy_dashboard Home Assistant integration"
requires-python = ">=3.14.2"
readme = "README.md"
license = "MIT"

[dependency-groups]
dev = [
    # Pinned to the Home Assistant 2026.9.x line (0.13.366 pins homeassistant==2026.9.3).
    "pytest-homeassistant-custom-component==0.13.366",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PL", "TRY", "DTZ"]
ignore = ["PLR0913", "PLR2004", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.amber_energy_dashboard"]
force-sort-within-sections = true
combine-as-imports = true
